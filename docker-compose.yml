# NEXUS control server, one container, no database to install.
#
#   cp .env.example .env     then fill it in on the server
#   docker compose up -d
#   docker compose logs -f
#
# The .env file is read by compose and passed to the container. It is NOT part
# of the image and must never be committed: it holds the owner token and the
# AI provider key.

services:
  nexus:
    build: .
    image: nexus-control:latest
    container_name: nexus-control
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
