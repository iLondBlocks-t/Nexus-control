# Reverse proxy for the NEXUS control server.
#
# The phone talks WebSocket over TLS (wss://). Terminate TLS here and forward
# both the API and the device socket to the Node process.
#
#   sudo cp deploy/nginx-nexus.conf /etc/nginx/sites-available/nexus
#   sudo ln -s /etc/nginx/sites-available/nexus /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d nexus.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace nexus.example.com everywhere, then set PUBLIC_BASE_URL to the same
# URL in .env — the server builds the phone's wss:// URL from it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexus.example.com;

    # Everything except the pairing completion requires the owner token, but
    # there is no reason to serve this server over plain HTTP either.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexus.example.com;

    ssl_certificate     /etc/letsencrypt/live/nexus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header x-content-type-options nosniff always;
    add_header referrer-policy no-referrer always;
    add_header x-frame-options DENY always;

    client_max_body_size 256k;

    # The control panel and the HTTP API.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The device WebSocket. The upgrade headers are what make it work; without
    # them the phone connects and is dropped immediately.
    location /api/v1/device {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
